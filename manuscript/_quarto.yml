project:
  type: book
  output-dir: _book

book:
  title: "Project Title"           # set per project (or written at Step 14)
  # subtitle: "Optional subtitle"
  author:
    - name: "Author Name"          # Step 7 rewrites this from project_brief.md (## Author)
      # affiliation: ""
      # email: ""
  date: today
  # abstract: written last, by a fresh-eyes reader (Step 14) — see index.qmd
  chapters:
    - index.qmd
    - 01-introduction.qmd
    - 02-background.qmd
    - 03-data.qmd
    - 04-methods.qmd
    - 05-results.qmd
    - 06-discussion.qmd
    - 07-conclusion.qmd
    - 08-appendix.qmd
    - references.qmd

# keywords: [ ... ]                 # set per project
# thanks: |                         # acknowledgments / grants / IRB approvals

bibliography: references.bib
csl: chicago-author-date.csl

# Sequential float numbering ("Table 1", not "Table 1.1") — standard for journal
# submission; the book default is chapter-prefixed numbering.
crossref:
  chapters: false

execute:
  freeze: auto
  echo: false
  warning: false
  message: false

format:
  # House typeset PDF (florilegium extension, installed by `make setup`). Typography,
  # headings, and title page come from the extension; xelatex + Minion Pro (free-font
  # fallback documented in the extension README).
  florilegium-pdf:
    knitr:
      opts_chunk:
        dev: cairo_pdf
  # Optional ASQ submission formats (Word + PDF), from the asq extension:
  # asq-docx: default
  # asq-pdf: default
